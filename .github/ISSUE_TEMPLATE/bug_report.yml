name: Bug report
description: Something in Smart Dark does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Smart Dark version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and operating system
      placeholder: "Chrome 156 on macOS 26"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Errors
      description: Errors from the service worker or page console, if any. Remove private details first.
      render: text
