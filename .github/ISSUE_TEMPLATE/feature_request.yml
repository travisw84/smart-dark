name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Smart Dark makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
