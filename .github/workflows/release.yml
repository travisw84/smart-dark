name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches the version
        run: |
          V=$(node -p "require('./package.json').version")
          test "v$V" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} does not match package.json version $V"; exit 1; }
          M=$(node -p "require('./public/manifest.json').version")
          test "$M" = "$V" || { echo "manifest.json version $M does not match $V"; exit 1; }
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p release
          (cd dist && zip -qr "../release/smart-dark-$V.zip" .)
          (cd release && sha256sum "smart-dark-$V.zip" > "smart-dark-$V.zip.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/smart-dark-*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* --title "Smart Dark ${{ github.ref_name }}" --generate-notes --verify-tag
